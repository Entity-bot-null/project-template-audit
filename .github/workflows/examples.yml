name: Examples

# The connected example projects (docs/adr/0010): each template at its pinned
# commit (examples/<kind>/template.json), its template patches applied
# (examples/<kind>/template-patch/: the connector shipped installed and off,
# the template's gaps filled), the connector brought to this repository's
# version from packages/, and examples/<kind>/overlay.patch when the example
# adds anything on top. Each passes its own
# gates with its own thresholds. The web example: `pnpm verify` without the
# Audit Hub variables, and its integration suite, where the connector's spec
# (src/audit/audit.int.spec.ts) runs it against an Audit Hub of its own. The
# app example: `pnpm verify` (its Jest suite runs the connector's specs and
# its adapters' against the stubbed API), and its Maestro flows on an
# Android emulator against its mock API.
on:
  pull_request:
    paths:
      - packages/audit-contract/**
      - packages/audit-nestjs/**
      - packages/audit-expo/**
      - packages/audit-web/**
      - apps/api/src/ingest/**
      - examples/web/**
      - examples/app/**
      - scripts/connector.mjs
      - scripts/examples.mjs
      - e2e/support/**
      - .github/workflows/examples.yml
  push:
    branches: [main]
    paths:
      - packages/audit-contract/**
      - packages/audit-nestjs/**
      - packages/audit-expo/**
      - packages/audit-web/**
      - apps/api/src/ingest/**
      - examples/web/**
      - examples/app/**
      - scripts/connector.mjs
      - scripts/examples.mjs
      - e2e/support/**
      - .github/workflows/examples.yml
  # Weekly too: Audit Hub's own pages and ingestion, which the paths above do
  # not cover, can break the cross suite.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The example's integration suite derives `<db>_test` from it.
  DATABASE_URL: postgresql://app:app@localhost:5432/app
  # As in quality-gates.yml: tool images through the mirror, by digest.
  TOOL_IMAGE_MIRROR: mirror.gcr.io

jobs:
  # The pinned PostgreSQL, Redis and Mailpit images, as in quality-gates.yml.
  tool-images:
    name: Tool images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      postgres: ${{ steps.images.outputs.postgres }}
      redis: ${{ steps.images.outputs.redis }}
      mailpit: ${{ steps.images.outputs.mailpit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/tool-images
            scripts/tool-image.mjs
          sparse-checkout-cone-mode: false
      - id: images
        run: |
          {
            echo "postgres=$(node scripts/tool-image.mjs --mirrored postgres)"
            echo "redis=$(node scripts/tool-image.mjs --mirrored redis)"
            echo "mailpit=$(node scripts/tool-image.mjs --mirrored mailpit)"
          } >> "$GITHUB_OUTPUT"

  examples-web:
    name: Example web (project-template-web + audit-nestjs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tool-images
    env:
      # The template's integration suite runs its Redis and email specs in CI
      # instead of skipping them: these throwaway servers.
      REDIS_TEST_URL: redis://localhost:6379
      MAIL_TEST_SMTP_URL: smtp://localhost:1025
      MAILPIT_TEST_URL: http://localhost:8025
    services:
      postgres:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.postgres }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.redis }} # zizmor: ignore[unpinned-images]
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.mailpit }} # zizmor: ignore[unpinned-images]
        env:
          MP_ENABLE_CHAOS: 'true'
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js and pnpm for Audit Hub's scripts; the example installs its own.
      - uses: ./.github/actions/setup
      - name: Generate the example (template at its pin, its patches, the connector)
        run: pnpm examples generate --kind web
      - name: The connectors' files as this repository ships them
        run: |
          pnpm connector status --target .examples/web --check
          pnpm connector status --target .examples/web/apps/web --check
      - name: The example's gates, without the Audit Hub variables
        working-directory: .examples/web
        env:
          HUSKY: '0'
        run: pnpm verify
      - name: The example's integration suite (the connector's spec included)
        working-directory: .examples/web
        run: pnpm test:integration

  # The cross suite (examples/web/e2e): Audit Hub and the example, both built,
  # in a real browser. An administrator registers the example, it starts with
  # the variables shown, and its sign-ins reach Audit Hub's explorer.
  examples-web-e2e:
    name: Example web with Audit Hub (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: tool-images
    env:
      # Both APIs send real messages here; a missing Mailpit fails them in CI.
      MAIL_TEST_SMTP_URL: smtp://localhost:1025
      MAILPIT_TEST_URL: http://localhost:8025
    services:
      postgres:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.postgres }} # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mailpit:
        # Digest-pinned: scripts/tool-image.mjs refuses a reference without one.
        image: ${{ needs.tool-images.outputs.mailpit }} # zizmor: ignore[unpinned-images]
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install the browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the browser's system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Build Audit Hub
        run: pnpm build
      - name: Generate the example
        run: pnpm examples generate --kind web
      - name: Build the example
        working-directory: .examples/web
        run: pnpm build
      - run: pnpm test:e2e:examples
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-examples-web
          path: |
            playwright-report/examples-web/
            test-results/examples-web/
          retention-days: 14

  examples-app:
    name: Example app (project-template-app + audit-expo)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js and pnpm for Audit Hub's scripts; the example installs its own.
      - uses: ./.github/actions/setup
      - name: Generate the example (template at its pin, its patches, the connector)
        run: pnpm examples generate --kind app
      - name: The connector's files as this repository ships them
        run: pnpm connector status --target .examples/app --check
      # Format, lint, types, Jest with its coverage thresholds, expo-doctor,
      # the supply-chain gates and the exported bundles against their budget.
      - name: The example's gates
        working-directory: .examples/app
        env:
          HUSKY: '0'
        run: pnpm verify

  # The example's Maestro flows (.maestro/, the connector's three included),
  # as the template's own e2e-android.yml runs them: a release build of the
  # E2E variant on an emulator, against its mock API.
  examples-app-e2e:
    name: Example app on an emulator (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      APP_VARIANT: e2e
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_API_URL: http://localhost:4010
      # As in the template's e2e-android.yml: Maestro's release and the
      # SHA-256 of maestro.zip, at least seven days old.
      MAESTRO_VERSION: cli-2.10.0
      MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build, its caches and the emulator's image do not fit in the
      # runner's free space otherwise (the template's workflow says why).
      - name: Free disk space
        timeout-minutes: 5
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ccache
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
      - name: Generate the example (template at its pin, its patches, the connector)
        run: pnpm examples generate --kind app
      - name: Restore the C and C++ compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-examples-app-x86_64-${{ hashFiles('.examples/app/pnpm-lock.yaml') }}
          restore-keys: ccache-examples-app-x86_64-
      - name: Generate the Android project
        timeout-minutes: 5
        working-directory: .examples/app
        run: pnpm exec expo prebuild --no-install --platform android --clean
      # After the Android project exists: setup-gradle keys its cache on the
      # Gradle files, and this repository has none until the example is
      # generated (the template's own workflow finds React Native's in its
      # node_modules from the start).
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Install the Android NDK
        timeout-minutes: 10
        working-directory: .examples/app
        run: |
          ndk=$(sed -nE 's/^ndkVersion *= *"([0-9.]+)".*/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          if [ -z "$ndk" ]; then
            echo "::error::No ndkVersion in node_modules/react-native/gradle/libs.versions.toml."
            exit 1
          fi
          echo "CCACHE_COMPILERCHECK=string:$ndk" >> "$GITHUB_ENV"
          find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$ndk" -exec rm -rf {} +
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "ndk;$ndk" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 &&
              grep -qF "Pkg.Revision = $ndk" "$ANDROID_HOME/ndk/$ndk/source.properties"; then
              echo "NDK $ndk installed (attempt $attempt)."
              exit 0
            fi
            tail -n 20 "$RUNNER_TEMP/sdkmanager.log"
            echo "::warning::Installing NDK $ndk failed (attempt $attempt)."
            rm -rf "$ANDROID_HOME/ndk/$ndk" "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates"
            sleep $((attempt * 15))
          done
          echo "::error::NDK $ndk could not be installed."
          exit 1
      - name: Build the release APK (emulator architecture only)
        working-directory: .examples/app/android
        timeout-minutes: 45
        run: |
          ccache --zero-stats > /dev/null
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=x86_64 \
            -x lintVitalRelease \
            --build-cache \
            --no-daemon \
            --console=plain \
            --stacktrace
          ccache --show-stats
      - name: Save the C and C++ compiler cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: ccache-examples-app-x86_64-${{ hashFiles('.examples/app/pnpm-lock.yaml') }}
      - name: Install Maestro
        timeout-minutes: 5
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"
      - name: Start the mock API (the template's, with the connector's routes)
        timeout-minutes: 2
        working-directory: .examples/app
        run: |
          node scripts/mock-api.mjs > "$RUNNER_TEMP/mock-api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl --silent --output /dev/null http://127.0.0.1:4010/ && exit 0
            sleep 1
          done
          echo "::error::The mock API did not start." && cat "$RUNNER_TEMP/mock-api.log" && exit 1
      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: .examples/app
          script: |
            adb reverse tcp:4010 tcp:4010
            adb shell settings put secure stylus_handwriting_enabled 0
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            maestro test .maestro --format junit --output .maestro/results/report.xml --test-output-dir .maestro/results
      # One archive: Maestro names each flow's folder after its title ("Was it
      # you?"), and an artifact refuses ?, :, *, <, >, | and quotes in paths.
      - name: Pack the Maestro results
        if: ${{ !cancelled() }}
        run: |
          if [ -d .examples/app/.maestro/results ]; then
            tar -czf "$RUNNER_TEMP/maestro-results.tgz" -C .examples/app/.maestro results
          fi
      - name: Upload the Maestro results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results-examples-app
          path: ${{ runner.temp }}/maestro-results.tgz
          retention-days: 14
      - name: Upload the mock API log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mock-api-log-examples-app
          path: ${{ runner.temp }}/mock-api.log
          retention-days: 14
